# Mantiene despierto el proyecto de Supabase (el plan gratis lo pausa tras 7 días sin uso).
# Corre solo cada 3 días y hace una consulta mínima. No toca tus datos.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 12 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://jkshavrhpoqtkuwxpktp.supabase.co/rest/v1/user_data?select=user_id&limit=1' \
            -H 'apikey: sb_publishable_xufseXK5syhEFZJBw4hKTw_JMdKG_4h')
          echo "Respuesta de Supabase: $code"
          [ "$code" -lt 500 ]

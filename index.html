<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Entreno</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0b;--s1:#131316;--s2:#1b1b20;--s3:#26262d;--ln:rgba(255,255,255,.07);--tx:#f4f4f6;--mu:#8a8a94;--mu2:#5c5c66;--ac:#b8f26b;--acd:rgba(184,242,107,.1);--acm:rgba(184,242,107,.3);--gold:#f5c451;--dn:#ff6b6b;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top);min-height:100vh}
#app{max-width:600px;margin:0 auto;padding:16px 20px calc(110px + env(safe-area-inset-bottom))}
h1{font-size:32px;letter-spacing:-.03em;margin:4px 0 20px;font-weight:800;line-height:1.1}
h2{font-size:13px;color:var(--mu);font-weight:600;margin:32px 0 12px;letter-spacing:.01em}
p{margin:6px 0 12px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600}
.card{background:var(--s1);border-radius:var(--r);padding:18px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.card.hl{box-shadow:inset 0 0 0 1.5px var(--acm)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.c{text-align:center}
.mu{color:var(--mu)}.sm{font-size:13px}
.t{font-weight:650;font-size:17px;letter-spacing:-.01em}
.clickable{cursor:pointer}
.link{color:var(--ac);font-size:14px;font-weight:600;background:none;border:none;padding:4px 0}
button{font:inherit;color:inherit;background:var(--s2);border:none;border-radius:14px;padding:10px 14px;cursor:pointer;touch-action:manipulation;transition:transform .08s}
button:active{transform:scale(.97);opacity:.8}
button:disabled{opacity:.3}
button.sm{font-size:13px;padding:7px 11px;border-radius:10px}
.pri{background:var(--ac);color:#0a0a0b;font-weight:700}
.ghost{background:none;color:var(--mu)}
.danger{color:var(--dn)}
.dangerbtn{background:var(--dn);color:#0a0a0b;font-weight:700}
.big{display:block;width:100%;padding:15px;font-size:17px;border-radius:16px;margin-top:8px}
.cta{padding:18px;font-size:18px;border-radius:18px}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--s2);white-space:nowrap;font-weight:600}
.badge.ac{color:var(--ac);background:var(--acd)}
.badge.gold{color:var(--gold);background:rgba(245,196,81,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--ac);color:#0a0a0b;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:var(--s2);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
textarea{resize:vertical;min-height:56px}
.f{display:block;margin:12px 0}
.f>span,.grid4 span{display:block;font-size:12px;color:var(--mu);margin-bottom:5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.sep{height:1px;background:var(--ln);margin:14px 0}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,11,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln);display:flex;padding:6px 4px calc(4px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;background:none;color:var(--mu2);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-weight:500}
.tabs button:active{transform:none}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{color:var(--ac)}
.tabs svg{width:24px;height:24px}

/* Inicio */
.today{position:relative;overflow:hidden;padding:22px;border-radius:26px;background:var(--s1);isolation:isolate}
.today:before{content:"";position:absolute;width:140%;aspect-ratio:1;right:-70%;top:-90%;background:radial-gradient(closest-side,rgba(184,242,107,.22),rgba(184,242,107,0) 70%);animation:drift 10s ease-in-out infinite alternate;z-index:-1;pointer-events:none}
.today:after{content:"";position:absolute;width:90%;aspect-ratio:1;left:-45%;bottom:-75%;background:radial-gradient(closest-side,rgba(130,120,255,.12),rgba(130,120,255,0) 70%);animation:drift2 13s ease-in-out infinite alternate;z-index:-1;pointer-events:none}
.today .n{font-size:36px;font-weight:850;letter-spacing:-.035em;line-height:1.05;margin:6px 0 4px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px}
.mchip{font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06)}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--mu2);font-weight:600}
.wd i{width:36px;height:36px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;color:#0a0a0b;font-weight:800}
.wd.pl i{box-shadow:inset 0 0 0 1.5px var(--acm)}
.wd.dn i{background:var(--ac);box-shadow:none}
.wd.td{color:var(--tx)}
.wd.td:not(.dn) i{box-shadow:inset 0 0 0 1.5px var(--tx)}
.hm{margin-top:16px}
.hm-m,.hm-g{display:grid;grid-template-columns:repeat(18,1fr);gap:3px}
.hm-m{font-size:11px;color:var(--mu2);margin-bottom:6px;height:14px}
.hm-m span{white-space:nowrap}
.hm-g{grid-template-rows:repeat(7,auto);grid-auto-flow:column}
.hm-g i{aspect-ratio:1;border-radius:3px;background:var(--s2)}
.hm-g i.l1{background:#2a3a1b}.hm-g i.l2{background:#46652a}.hm-g i.l3{background:#7aa843}.hm-g i.l4{background:var(--ac)}
.hm-g i.fut{background:transparent}
.hm-g i.td{outline:1.5px solid var(--tx);outline-offset:-1.5px}
.bigstat{font-size:44px;font-weight:850;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* Progreso */
.seg{display:flex;gap:4px;background:var(--s1);padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{flex:1;border-radius:10px;padding:8px 4px;font-size:14px;background:none;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--s1);border-radius:18px;padding:16px 10px;text-align:center}
.tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--mu)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tiles2 .tile{text-align:left;padding:16px}
.tiles2 .tile b{font-size:24px;margin:4px 0 2px}
.exrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.exrow:last-child{border-bottom:none}
.exrow svg{flex-shrink:0}
.up{color:var(--ac)}.down{color:var(--dn)}
.chart{width:100%;height:auto;display:block;margin-top:12px}

/* Entrenamiento guiado */
.head{position:sticky;top:0;z-index:4;margin:0 -20px;padding:6px 20px 12px;background:rgba(10,10,11,.72);backdrop-filter:saturate(1.5) blur(18px);-webkit-backdrop-filter:saturate(1.5) blur(18px);display:flex;align-items:center;gap:8px}
.head .ghost{padding-left:0}
.bar{height:3px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -20px 0;padding:0 20px 2px;scroll-behavior:smooth}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;border-radius:99px;padding:7px 13px;font-size:13px;flex-shrink:0;background:var(--s1);color:var(--mu)}
.pill.on{background:var(--tx);color:#0a0a0b;font-weight:700}
.pill.dn:not(.on){color:var(--ac)}
.pill.sk:not(.on){opacity:.4;text-decoration:line-through}
.exmeta{margin-top:24px}
.exname{font-size:32px;font-weight:850;letter-spacing:-.035em;line-height:1.08;margin:6px 0}
.exname.clickable:after{content:" ›";color:var(--mu2);font-weight:600}
.note{font-size:14px;color:var(--mu);background:var(--s1);border-radius:12px;padding:9px 12px;margin-top:12px}
.setcard{background:var(--s1);border-radius:26px;padding:20px 18px;margin-top:18px}
.setno{font-size:20px;font-weight:800;letter-spacing:-.02em}
.lastline{font-size:13px;color:var(--mu);margin-top:4px}
.hint{display:flex;align-items:center;gap:8px;background:var(--acd);color:var(--ac);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);margin:20px 0 8px;text-align:center;font-weight:600}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:10px;align-items:center}
.stepper button{height:64px;font-size:28px;border-radius:50%;padding:0;background:var(--s2);font-weight:300}
.stepper input{height:72px;font-size:46px;font-weight:800;text-align:center;border-radius:16px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:transparent;padding:0}
.stepper input:focus{background:var(--s2)}
.plates{text-align:center;font-size:12.5px;color:var(--mu);margin-top:6px;min-height:18px}
.cta-done{margin-top:22px}
.donelist{margin-top:14px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--ln)}
.drow:last-child{border-bottom:none}
.drow .ck{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#0a0a0b;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.drow .ck.pr{background:var(--gold)}
.wkacts{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px;margin-top:18px}
.wkacts button{padding:14px 8px;border-radius:16px;background:var(--s1);font-size:15px}
.fin{text-align:center;padding-top:26px}
.fin .emoji{font-size:52px}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}

/* Descanso */
#rest:not(:empty){position:fixed;inset:0;z-index:15;background:var(--bg)}
.restfs{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin-top:14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring-bg{stroke:var(--s2)}
.ring-fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .clock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:68px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.rbtns{display:flex;gap:12px;margin-top:28px}
.rbtns button{padding:12px 22px;border-radius:99px;font-size:16px;background:var(--s1)}
.next{width:100%;background:var(--s1);border-radius:20px;padding:16px 18px;margin-top:30px}

/* Hojas y avisos */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .28s ease}
#modal.open{opacity:1;pointer-events:auto}
#modal .sheet{transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.9,.25,1)}
#modal.open .sheet{transform:none}
.sheet{background:var(--s1);border-radius:26px 26px 0 0;width:100%;max-width:600px;max-height:86vh;overflow:auto;padding:10px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet:before{content:"";display:block;width:38px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 14px}
.sheet .big{background:var(--s2)}
.sheet .big.pri{background:var(--ac)}
.sheet .big.dangerbtn{background:var(--dn)}
.sheet .big.ghost{background:none}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border-bottom:1px solid var(--ln);border-radius:0;padding:14px 2px}
.pick:active{transform:none}
.grp{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 2px;font-weight:600}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-24px) scale(.9);opacity:0;visibility:hidden;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:650;z-index:30;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s,visibility 0s .35s;pointer-events:none;max-width:90vw;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1.2),opacity .25s,visibility 0s}
#toast.gold{background:var(--gold)}
.slist div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln);font-size:15px}
.slist div:last-child{border-bottom:none}
.hset{display:grid;grid-template-columns:22px 1fr 1fr 40px;gap:7px;align-items:center;margin-top:7px}
.hset input{text-align:center}

/* ---------- Movimiento ---------- */
body{background:radial-gradient(90% 45% at 50% -12%,rgba(184,242,107,.07),rgba(184,242,107,0) 70%) no-repeat,var(--bg)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-18%,14%) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(20%,-12%) scale(1.1)}}
@keyframes shimmer{from{transform:translateX(-120%)}to{transform:translateX(320%)}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 0 rgba(184,242,107,0))}50%{filter:drop-shadow(0 0 18px rgba(184,242,107,.4))}}
@keyframes zoomIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#app.enter>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}
#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(6){animation-delay:.2s}#app.enter>*:nth-child(7){animation-delay:.24s}
#app.enter>*:nth-child(8){animation-delay:.28s}#app.enter>*:nth-child(9){animation-delay:.32s}#app.enter>*:nth-child(n+10){animation-delay:.36s}
#app.enter .head{animation:fade .4s both}
#app.enter .wd i{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
#app.enter .wd:nth-child(2) i{animation-delay:.25s}#app.enter .wd:nth-child(3) i{animation-delay:.3s}#app.enter .wd:nth-child(4) i{animation-delay:.35s}
#app.enter .wd:nth-child(5) i{animation-delay:.4s}#app.enter .wd:nth-child(6) i{animation-delay:.45s}#app.enter .wd:nth-child(7) i{animation-delay:.5s}#app.enter .wd:nth-child(1) i{animation-delay:.2s}
#app.enter .hm-g i{animation:pop .4s ease-out both}
.grad{background:linear-gradient(180deg,#fff 35%,#a6a6b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar i,.pbar i{position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;top:0;bottom:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shimmer 2.6s ease-in-out infinite}
.swap{animation:slideIn .42s cubic-bezier(.2,.8,.2,1) both}
.setcard.swap{animation-delay:.05s}
.stepper input.bump{animation:bump .28s ease-out}
.drow.pop{animation:up .4s ease-out both}
.drow.pop .ck{animation:pop .55s cubic-bezier(.2,.9,.3,1.4) both}
.pri{box-shadow:0 8px 24px -10px rgba(184,242,107,.55)}
.cta-done{position:relative;overflow:hidden}
.cta-done:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:shimmer 3.2s ease-in-out infinite 1s}
.tabs button.on svg{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
.restfs{animation:fade .35s ease both}
.restfs .ring{animation:zoomIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.ring svg{animation:breathe 3.2s ease-in-out infinite}
.clock.urgent{color:var(--ac)}
.clock.tick{animation:bump .45s ease-out}
.next{animation:up .5s .15s both}
.pill{transition:background .25s,color .25s}
.card.clickable,.exrow{transition:background .2s}
.card.clickable:active{background:var(--s2)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.fin .emoji{display:inline-block;animation:pop .7s cubic-bezier(.2,.9,.3,1.4) both}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
.plan{display:grid;gap:4px;margin-top:18px}
.ps{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:11.5px;line-height:1.25;color:var(--mu);position:relative;min-width:0}
.ps span{overflow-wrap:anywhere}
.ps i{width:38px;height:38px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:15px;color:var(--mu);position:relative;z-index:1}
.ps.dn i{background:var(--ac);color:#0a0a0b}
.ps.nx i{box-shadow:inset 0 0 0 1.5px var(--ac);color:var(--ac)}
.ps.nx{color:var(--tx);font-weight:600}
.ps:not(:last-child):after{content:"";position:absolute;top:18px;left:calc(50% + 23px);right:calc(-50% + 23px);height:2px;border-radius:2px;background:var(--s3)}
.ps.dn:not(:last-child):after{background:var(--acm)}
#app.enter .ps i{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
#app.enter .ps:nth-child(1) i{animation-delay:.2s}#app.enter .ps:nth-child(2) i{animation-delay:.28s}#app.enter .ps:nth-child(3) i{animation-delay:.36s}#app.enter .ps:nth-child(4) i{animation-delay:.44s}#app.enter .ps:nth-child(n+5) i{animation-delay:.5s}
.avatar{width:44px;height:44px;border-radius:50%;padding:0;background:linear-gradient(140deg,#c9f78a,#7fd65a);color:#0a0a0b;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;margin-top:4px}
.avatar.sm{width:40px;height:40px;font-size:16px;margin:0}
.avatar.xl{width:88px;height:88px;font-size:38px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(140deg,#c9f78a,#7fd65a);color:#0a0a0b;font-weight:850;box-shadow:0 12px 40px -12px rgba(184,242,107,.6)}
.avatar i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--bg)}
[data-sync]{background:var(--mu2)}
[data-sync="ok"]{background:var(--ac)}[data-sync="pending"],[data-sync="syncing"]{background:var(--gold)}[data-sync="error"]{background:var(--dn)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.welcome{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;max-width:420px;margin:0 auto;padding:20px 4px}
.wlogo{width:96px;height:96px;margin:0 auto 18px;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px -15px rgba(184,242,107,.45);animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both}
.wlogo img{width:100%;height:100%;display:block}
.wtitle{font-size:40px;font-weight:850;letter-spacing:-.04em;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}

<script>
'use strict';
const KEY = 'entreno.v1', VERSION = '5.1';
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const num = v => (v === '' || v == null) ? NaN : parseFloat(String(v).replace(',', '.'));
const fmtNum = n => (n === '' || n == null || !Number.isFinite(+n)) ? '' : String(Math.round(n * 100) / 100);
const r2 = n => Math.round(n * 100) / 100;
const DAYN = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DAYL = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DAY_ORDER = [1,2,3,4,5,6,0];
const RESTS = [30,45,60,75,90,120,150,180,240,300];
const STEPS = [0.5,1,1.25,2.5,5];
const MUSCLES = ['Pecho','Espalda','Hombro','Bíceps','Tríceps','Antebrazo','Trapecio','Cuádriceps','Femoral','Glúteo','Gemelos','Aductores','Abdomen','Cuerpo completo','Otro'];

const LIB = [
  ['Press de banca con barra','Pecho'],['Press inclinado con barra','Pecho'],['Press de banca con mancuernas','Pecho'],
  ['Press inclinado con mancuernas','Pecho'],['Press en máquina','Pecho'],['Aperturas con mancuernas','Pecho'],
  ['Cruces en polea','Pecho'],['Pec deck','Pecho'],['Fondos en paralelas','Pecho'],['Flexiones','Pecho'],
  ['Press militar con barra','Hombro'],['Press de hombro con mancuernas','Hombro'],['Press de hombro en máquina','Hombro'],
  ['Elevaciones laterales','Hombro'],['Elevaciones laterales en polea','Hombro',1],['Elevaciones frontales','Hombro'],
  ['Pájaros (deltoide posterior)','Hombro'],['Face pull','Hombro'],
  ['Extensión de tríceps en polea','Tríceps'],['Extensión de tríceps sobre la cabeza','Tríceps'],['Press francés','Tríceps'],
  ['Press cerrado','Tríceps'],['Patada de tríceps','Tríceps',1],
  ['Dominadas','Espalda'],['Jalón al pecho','Espalda'],['Remo con barra','Espalda'],['Remo con mancuerna','Espalda',1],
  ['Remo en polea baja','Espalda'],['Remo en máquina','Espalda'],['Pullover en polea','Espalda'],['Peso muerto','Espalda'],
  ['Encogimientos','Trapecio'],
  ['Curl con barra','Bíceps'],['Curl con mancuernas','Bíceps'],['Curl martillo','Bíceps'],['Curl en banco inclinado','Bíceps'],
  ['Curl en polea','Bíceps'],['Curl predicador','Bíceps'],['Curl de muñeca','Antebrazo'],
  ['Sentadilla con barra','Cuádriceps'],['Sentadilla frontal','Cuádriceps'],['Prensa de piernas','Cuádriceps'],
  ['Sentadilla hack','Cuádriceps'],['Extensión de cuádriceps','Cuádriceps'],['Zancadas','Cuádriceps',1],
  ['Sentadilla búlgara','Cuádriceps',1],['Sentadilla goblet','Cuádriceps'],
  ['Peso muerto rumano','Femoral'],['Curl femoral acostado','Femoral'],['Curl femoral sentado','Femoral'],['Buenos días','Femoral'],
  ['Hip thrust','Glúteo'],['Patada de glúteo en polea','Glúteo',1],['Abducción en máquina','Glúteo'],
  ['Aducción en máquina','Aductores'],
  ['Elevación de talones de pie','Gemelos'],['Elevación de talones sentado','Gemelos'],['Gemelos en prensa','Gemelos'],
  ['Plancha','Abdomen'],['Crunch en polea','Abdomen'],['Elevación de piernas colgado','Abdomen'],['Rueda abdominal','Abdomen'],
];

/* ---------- Datos ---------- */
function seed() {
  const exercises = LIB.map(([name, muscle, uni]) => ({ id: uid(), name, muscle, unilateral: !!uni, custom: false }));
  const find = n => exercises.find(e => e.name === n).id;
  const mk = (name, days, names) => ({
    id: uid(), name, desc: '', days, archived: false,
    items: names.map(n => ({ id: uid(), exerciseId: find(n), sets: 3, repMin: 8, repMax: 10, rest: 120, notes: '' }))
  });
  return {
    version: 1,
    settings: { name: '', unit: 'kg', rest: 120, step: 2.5, bar: 20, lastBackup: 0 },
    exercises,
    routines: [],
    sessions: [],
    active: null
  };
}
// Tus 4 rutinas, tomadas de la planilla "Rutina Gym"
const SHEET_VERSION = 2;
const SHEET = [
  ['Torso A', 'Compuestos', [
    ['Press inclinado con barra', 'Pecho'], ['Remo en T', 'Espalda'], ['Press militar con barra', 'Hombro'],
    ['Dominadas', 'Espalda'], ['Curl bayesian en polea', 'Bíceps', { uni: 1 }], ['Extensión de tríceps en polea', 'Tríceps']]],
  ['Pierna · cuádriceps', 'Cuádriceps', [
    ['Sentadilla hack', 'Cuádriceps', { note: 'O prensa si está ocupada' }], ['Estocadas en Smith', 'Glúteo', { uni: 1 }],
    ['Curl femoral sentado', 'Femoral'], ['Camilla de cuádriceps', 'Cuádriceps'],
    ['Abducción en máquina', 'Glúteo', { note: 'Abductores (hacia afuera)' }], ['Elevación de talones unilateral con mancuerna', 'Gemelos', { uni: 1 }]]],
  ['Torso B', 'Accesorios', [
    ['Fondos en paralelas', 'Pecho'], ['Jalón agarre cerrado', 'Espalda'], ['Aperturas con mancuernas', 'Pecho'],
    ['Elevaciones laterales en polea', 'Hombro'], ['Face pull', 'Hombro'], ['Curl martillo en banco Scott', 'Bíceps']]],
  ['Pierna · posterior', 'Posterior', [
    ['Peso muerto rumano', 'Femoral', { note: 'Ejercicio nuevo' }], ['Hip thrust', 'Glúteo'], ['Sentadilla búlgara', 'Cuádriceps'],
    ['Curl femoral acostado', 'Femoral'], ['Aducción en máquina', 'Aductores', { note: 'Aductores (hacia adentro)' }], ['Elevación de talones sentado', 'Gemelos']]],
];
function importSheet(d) {
  const v = d.sheetV || 0;
  if (v >= SHEET_VERSION) return d;
  // Solo quien venía de versiones anteriores recibe las rutinas de la planilla; los usuarios nuevos empiezan vacíos
  const legacy = d.sessions.length || d.routines.some(r => ['Push', 'Pull', 'Pierna A', 'Pierna B'].includes(r.name));
  if (v < 1 && legacy) {
    const findEx = (name, muscle, uni) => {
      let e = d.exercises.find(x => norm(x.name) === norm(name));
      if (!e) { e = { id: uid(), name, muscle, unilateral: !!uni, custom: true }; d.exercises.push(e); }
      return e.id;
    };
    d.routines.forEach(r => { if (['Push', 'Pull', 'Pierna A', 'Pierna B'].includes(r.name)) r.archived = true; });
    SHEET.forEach(([name, desc, items]) => {
      if (d.routines.some(r => r.name === name && !r.archived)) return;
      d.routines.push({ id: uid(), name, desc, days: [], archived: false, items: items.map(([n, m, o = {}]) =>
        ({ id: uid(), exerciseId: findEx(n, m, o.uni), sets: 3, repMin: 8, repMax: 10, rest: 120, notes: o.note || '' })) });
    });
    // Las rutinas de tu plan van primero, en el orden de la planilla
    const names = SHEET.map(x => x[0]);
    d.routines.sort((a, b) => (names.includes(a.name) ? names.indexOf(a.name) : 99) - (names.includes(b.name) ? names.indexOf(b.name) : 99));
  }
  // v2: sin pesos de la planilla y sin días fijos
  d.routines.forEach(r => {
    r.days = [];
    r.items.forEach(it => { delete it.startW; if (/^En tu planilla|^8 kg por lado$/.test(it.notes || '')) it.notes = ''; });
  });
  d.sheetV = SHEET_VERSION;
  return d;
}

function migrate(d) {
  d.settings = Object.assign({ name: '', unit: 'kg', rest: 120, step: 2.5, bar: 20, lastBackup: 0 }, d.settings || {});
  d.exercises = d.exercises || []; d.routines = d.routines || []; d.sessions = d.sessions || [];
  d.active = d.active || null; d.version = 1;
  d.profile = Object.assign({ height: '', birthYear: '', goal: '' }, d.profile || {});
  d.body = d.body || []; d.deleted = d.deleted || [];
  return d;
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return importSheet(migrate(JSON.parse(raw))); } catch (e) {}
  return importSheet(migrate(seed()));
}
let S = load();
function save(touch = true) {
  if (touch) S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar: ' + e.message); }
  if (touch) schedulePush();
}

/* ---------- Cuenta y nube (Supabase) ---------- */
// Completá estos dos datos con los de tu proyecto de Supabase
const SUPA_URL = 'https://jkshavrhpoqtkuwxpktp.supabase.co';
const SUPA_KEY = 'sb_publishable_xufseXK5syhEFZJBw4hKTw_JMdKG_4h';
const AKEY = 'entreno.auth';
// Si llegás desde el link de confirmación del email, la sesión viene en la dirección
function authFromLink() {
  try {
    const h = new URLSearchParams(location.hash.slice(1));
    const at = h.get('access_token'), rt = h.get('refresh_token');
    if (!at || !rt) return null;
    const pl = JSON.parse(atob(at.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    history.replaceState(null, '', location.pathname);
    return { access_token: at, refresh_token: rt, expires_in: +h.get('expires_in') || 3600, user: { id: pl.sub, email: pl.email } };
  } catch (e) { return null; }
}
const cloudOn = () => !!(SUPA_URL && SUPA_KEY);
let AUTH = null;
try { AUTH = JSON.parse(localStorage.getItem(AKEY) || 'null'); } catch (e) {}
const linkAuth = authFromLink();
if (linkAuth) { setAuth(linkAuth); S.skipWelcome = true; }
let syncState = 'off', syncErr = '', syncing = false, pushT = 0;
function setAuth(j) {
  AUTH = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: Date.now() + (j.expires_in || 3600) * 1000, user: { id: j.user.id, email: j.user.email } };
  localStorage.setItem(AKEY, JSON.stringify(AUTH));
}
function clearAuth() { AUTH = null; localStorage.removeItem(AKEY); setSync('off'); }
function setSync(st) {
  syncState = st;
  document.querySelectorAll('[data-sync]').forEach(el => { el.dataset.sync = st; });
  const t = $('#synctxt'); if (t) t.textContent = syncLabel();
}
function syncLabel() {
  if (!cloudOn()) return 'Servidor sin configurar';
  if (!AUTH) return 'Sin cuenta: los datos están solo en este dispositivo';
  return { ok: 'Sincronizado' + (S.lastSync ? ' · ' + fmtTime(S.lastSync) : ''), syncing: 'Sincronizando…', pending: 'Cambios pendientes de subir', error: 'Error al sincronizar' + (syncErr ? ' (' + syncErr + ')' : ''), off: 'Sin sincronizar' }[syncState] || '';
}
async function authCall(path, body) {
  const r = await fetch(SUPA_URL + '/auth/v1/' + path, { method: 'POST', headers: { apikey: SUPA_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || ('Error ' + r.status));
  return j;
}
const authMsg = m => /invalid login/i.test(m) ? 'Email o contraseña incorrectos'
  : /already registered|already exists/i.test(m) ? 'Ya existe una cuenta con ese email'
  : /at least 6|password should/i.test(m) ? 'La contraseña tiene que tener al menos 6 caracteres'
  : /not confirmed/i.test(m) ? 'Confirmá tu email antes de iniciar sesión'
  : /failed to fetch|network/i.test(m) ? 'Sin conexión' : m;
async function refreshAuth() {
  const j = await authCall('token?grant_type=refresh_token', { refresh_token: AUTH.refresh_token });
  setAuth(j);
}
async function api(path, opts = {}, retry = true) {
  if (AUTH && Date.now() > AUTH.expires_at - 60000) await refreshAuth();
  const r = await fetch(SUPA_URL + path, Object.assign({}, opts, { headers: Object.assign({ apikey: SUPA_KEY, Authorization: 'Bearer ' + AUTH.access_token, 'Content-Type': 'application/json' }, opts.headers || {}) }));
  if (r.status === 401 && retry) { await refreshAuth(); return api(path, opts, false); }
  return r;
}
function schedulePush() {
  if (!cloudOn() || !AUTH) return;
  setSync('pending'); clearTimeout(pushT); pushT = setTimeout(syncNow, 2000);
}
// Une los datos de este dispositivo con los de la nube sin perder entrenamientos
function mergeData(L, Rm) {
  Rm = migrate(JSON.parse(JSON.stringify(Rm)));
  // Dispositivo nuevo sin entrenamientos propios: toma todo de la cuenta
  if (!L.lastSync && !L.sessions.length) { Rm.active = L.active || null; Rm.lastSync = 0; return Rm; }
  const lNew = !!L.lastSync && (L.updatedAt || 0) >= (Rm.updatedAt || 0);
  const base = JSON.parse(JSON.stringify(lNew ? L : Rm)), other = JSON.parse(JSON.stringify(lNew ? Rm : L));
  const del = new Set([...(L.deleted || []), ...(Rm.deleted || [])]);
  // mismos ejercicios con distinto id (dos dispositivos) -> un solo id
  const map = {};
  other.exercises.forEach(e => { if (base.exercises.some(b => b.id === e.id)) return; const b = base.exercises.find(b => norm(b.name) === norm(e.name)); if (b) map[e.id] = b.id; });
  const fix = id => map[id] || id;
  other.exercises = other.exercises.filter(e => !map[e.id]);
  other.sessions.forEach(s => s.exercises.forEach(e => e.exerciseId = fix(e.exerciseId)));
  // cada cosa conserva su versión más reciente (campo u = última edición)
  const pick = (a, b) => (b && (b.u || 0) > ((a && a.u) || 0)) ? b : a;
  const union = (a, b) => { const m = new Map(); a.forEach(x => m.set(x.id, x)); b.forEach(x => { const y = m.get(x.id); m.set(x.id, y ? pick(y, x) : x); }); return [...m.values()].filter(x => !del.has(x.id)); };
  base.settings = pick(base.settings, other.settings);
  base.profile = pick(base.profile, other.profile);
  other.routines = other.routines.filter(r => base.routines.some(b => b.id === r.id) || !base.routines.some(b => norm(b.name) === norm(r.name)));
  other.routines.forEach(r => r.items.forEach(it => it.exerciseId = fix(it.exerciseId)));
  base.routines = union(base.routines, other.routines);
  base.sessions = union(base.sessions, other.sessions).sort((x, y) => x.start - y.start);
  base.exercises = union(base.exercises, other.exercises);
  base.body = union(base.body || [], other.body || []).sort((x, y) => x.date - y.date);
  base.deleted = [...del].slice(-2000);
  base.active = L.active || null;
  if (base.active) base.active.exercises.forEach(e => e.exerciseId = fix(e.exerciseId));
  base.updatedAt = Math.max(L.updatedAt || 0, Rm.updatedAt || 0);
  base.lastSync = L.lastSync;
  return base;
}
async function syncNow() {
  if (!cloudOn() || !AUTH || syncing) return;
  if (!navigator.onLine) { setSync('pending'); return; }
  syncing = true; setSync('syncing');
  try {
    const before = JSON.stringify(S);
    const r = await api(`/rest/v1/user_data?select=data&user_id=eq.${AUTH.user.id}`);
    if (!r.ok) throw new Error('lectura ' + r.status);
    const rows = await r.json();
    if (rows[0] && rows[0].data) S = mergeData(S, rows[0].data);
    S.lastSync = Date.now();
    localStorage.setItem(KEY, JSON.stringify(S));
    const w = await api('/rest/v1/user_data', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ user_id: AUTH.user.id, data: S, updated_at: new Date().toISOString() }) });
    if (!w.ok) throw new Error('escritura ' + w.status);
    syncErr = ''; setSync('ok');
    const changed = JSON.stringify(Object.assign({}, S, { lastSync: 0 })) !== JSON.stringify(Object.assign({}, JSON.parse(before), { lastSync: 0 }));
    if (changed && !['workout', 'edit', 'log', 'welcome'].includes(R.view)) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch (e) {
    syncErr = e.message; setSync(navigator.onLine ? 'error' : 'pending');
    if (/refresh|token|jwt/i.test(e.message)) { clearAuth(); toast('Tu sesión venció: volvé a iniciar sesión'); }
  } finally { syncing = false; }
}
window.addEventListener('online', () => syncNow());
document.addEventListener('visibilitychange', () => { if (!document.hidden && AUTH && Date.now() - (S.lastSync || 0) > 30000) syncNow(); });
save(false);
const exById = id => S.exercises.find(e => e.id === id);
const unit = () => S.settings.unit;

function lastFor(exId, beforeTs = Infinity) {
  for (let i = S.sessions.length - 1; i >= 0; i--) {
    const s = S.sessions[i]; if (s.start >= beforeTs) continue;
    const e = s.exercises.find(x => x.exerciseId === exId && x.sets.length);
    if (e) return { date: s.start, sets: e.sets };
  }
  return null;
}
const sessVol = s => s.exercises.reduce((a, e) => a + e.sets.reduce((b, x) => b + x.w * x.r, 0), 0);
const sessSets = s => s.exercises.reduce((a, e) => a + e.sets.length, 0);
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);
function bestBefore(exId, beforeTs) {
  let e1 = 0, w = 0, any = false;
  S.sessions.forEach(s => { if (s.start >= beforeTs) return; s.exercises.forEach(e => { if (e.exerciseId !== exId) return; e.sets.forEach(x => { any = true; e1 = Math.max(e1, e1rm(x.w, x.r)); w = Math.max(w, x.w); }); }); });
  return { e1, w, any };
}
// Historia de un ejercicio: una entrada por sesión
function exSeries(exId) {
  const out = [];
  S.sessions.forEach(s => s.exercises.forEach(e => {
    if (e.exerciseId !== exId || !e.sets.length) return;
    const best = e.sets.reduce((b, x) => e1rm(x.w, x.r) > e1rm(b.w, b.r) ? x : b, e.sets[0]);
    out.push({ date: s.start, sid: s.id, sets: e.sets, e1: e1rm(best.w, best.r), best, maxW: Math.max(...e.sets.map(x => x.w)) });
  }));
  return out;
}
function routineMuscles(r) { return [...new Set(r.items.map(it => (exById(it.exerciseId) || {}).muscle).filter(Boolean))]; }
function routineMin(r) { const s = r.items.reduce((a, it) => a + it.sets * (45 + it.rest), 0); return Math.max(5, Math.round(s / 300) * 5); }
function plates(w, name) {
  if (unit() !== 'kg' || !norm(name).includes('barra')) return '';
  const bar = S.settings.bar || 20;
  if (!Number.isFinite(w) || w < bar) return '';
  if (w === bar) return 'Solo la barra';
  let side = r2((w - bar) / 2); const out = [];
  for (const p of [25, 20, 15, 10, 5, 2.5, 1.25]) while (side >= p - 1e-9) { out.push(p); side = r2(side - p); }
  return side > 0.01 ? '' : 'Por lado: ' + out.map(fmtNum).join(' + ');
}

/* ---------- Formato ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtRest = v => v < 60 ? v + ' s' : Math.floor(v / 60) + ':' + pad(v % 60);

function fmtClock(ms) { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; }

function fmtBig(n) { n = Math.round(n); if (n >= 1e6) return (Math.round(n / 1e5) / 10).toLocaleString('es-UY') + ' M'; if (n >= 1e4) return (Math.round(n / 100) / 10).toLocaleString('es-UY') + ' k'; return n.toLocaleString('es-UY'); }
const fmtDate = ts => new Date(ts).toLocaleDateString('es-UY', { weekday: 'long', day: 'numeric', month: 'long' });

const repsTxt = (a, b) => a === b ? a : `${a}–${b}`;
const daysLabel = days => DAY_ORDER.filter(k => days.includes(k)).map(k => DAYN[k]).join(' · ');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const uname = () => (S.settings.name || '').trim();
function greet() { const h = new Date().getHours(), n = uname(); return (h < 6 ? 'Buenas noches' : h < 12 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches') + (n ? ', ' + esc(n) : ''); }
function weekStart(ts = Date.now()) { const d = new Date(ts); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); }

/* ---------- Gráficas ---------- */
function spark(vals, w = 76, h = 26) {
  if (vals.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * (w - 6) + 3, h - 3 - (v - mn) / rg * (h - 6)]);
  const l = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#b8f26b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="2.6" fill="#b8f26b"/></svg>`;
}
function lineChart(points, suffix) {
  const W = 340, H = 150, pl = 4, pr = 6, pt = 18, pb = 22;
  if (!points.length) return '';
  const ys = points.map(p => p.y), mn = Math.min(...ys), mx = Math.max(...ys);
  const padY = (mx - mn) * .15 || mx * .1 || 1, lo = mn - padY, hi = mx + padY;
  const X = i => points.length === 1 ? W / 2 : pl + i / (points.length - 1) * (W - pl - pr);
  const Y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const P = points.map((p, i) => [X(i), Y(p.y)]);
  const pts = P.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  const area = `M${P[0][0].toFixed(1)},${H - pb} L${pts.split(' ').join(' L')} L${P[P.length - 1][0].toFixed(1)},${H - pb} Z`;
  const last = P[P.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8f26b" stop-opacity=".28"/><stop offset="1" stop-color="#b8f26b" stop-opacity="0"/></linearGradient></defs>
    <line x1="0" x2="${W}" y1="${Y(mx).toFixed(1)}" y2="${Y(mx).toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>
    <text x="${W}" y="${(Y(mx) - 5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8a8a94">máx ${Math.round(mx)} ${suffix}</text>
    ${points.length > 1 ? `<path d="${area}" fill="url(#gA)"/><polyline points="${pts}" fill="none" stroke="#b8f26b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="#b8f26b" stroke="#131316" stroke-width="2"/>
    <text x="${pl}" y="${H - 5}" font-size="10" fill="#8a8a94">${fmtShort(points[0].x)}</text>
    ${points.length > 1 ? `<text x="${W - pr}" y="${H - 5}" text-anchor="end" font-size="10" fill="#8a8a94">${fmtShort(points[points.length - 1].x)}</text>` : ''}</svg>`;
}

/* ---------- Navegación ---------- */
let R = { view: S.active ? 'workout' : (cloudOn() && !AUTH && !S.skipWelcome ? 'welcome' : 'home'), id: null, from: 'home' };
let draft = null, editHist = false, peek = false, metric = 'ent', fresh = null;

let lastView = null, lastCur = null, justDone = null, bumpF = null, enterT = 0;
const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp() {
  if (reduced) return;
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count; if (!to) return;
    const t0 = performance.now(), dur = 900;
    const f = now => { const p = Math.min(1, (now - t0) / dur), k = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * k).toLocaleString('es-UY'); if (p < 1) requestAnimationFrame(f); };
    el.textContent = '0'; requestAnimationFrame(f);
  });
}
function confetti(n = 120) {
  if (reduced) return;
  const c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.className = 'confetti'; c.width = W * dpr; c.height = H * dpr; document.body.appendChild(c);
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const cols = ['#b8f26b', '#f5c451', '#ffffff', '#9b8cff', '#6be3f2'];
  const P = Array.from({ length: n }, () => ({ x: W / 2 + (Math.random() - .5) * 60, y: H * .32, vx: (Math.random() - .5) * 11, vy: -Math.random() * 12 - 4, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[Math.random() * cols.length | 0] }));
  const t0 = performance.now();
  (function f(now) {
    const t = now - t0; x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .3; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - t / 2000); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (t < 2000) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function render() {

/* ---------- Inicio ---------- */
function plan() {
  const act = S.routines.filter(r => !r.archived), ws = weekStart();
  const wk = S.sessions.filter(s => s.start >= ws);
  const done = new Set(wk.map(s => s.routineId).filter(Boolean));
  const next = act.find(r => !done.has(r.id)) || null;
  const today = S.sessions.filter(s => dayKey(s.start) === dayKey(Date.now()));
  return { act, wk, done, next, today, count: act.filter(r => done.has(r.id)).length };
}
function weeklyGoal() { return Math.max(1, S.routines.filter(r => !r.archived).length); }
function calcStreak(goal) {
  const count = ws => { const we = addDays(ws, 7); return S.sessions.filter(s => s.start >= ws && s.start < we).length; };
  let ws = weekStart(), n = 0;
  if (count(ws) >= goal) n++;
  ws = addDays(ws, -7);
  for (let k = 0; k < 520 && count(ws) >= goal; k++) { n++; ws = addDays(ws, -7); }
  return n;
}
function heatmap(W = 18) {
  const start = addDays(weekStart(), -(W - 1) * 7), now = Date.now();
  const per = {};
  S.sessions.forEach(s => { const k = dayKey(s.start); per[k] = (per[k] || 0) + sessSets(s); });
  const max = Math.max(1, ...Object.values(per));
  let cells = '', months = '', lastM = -1;
  for (let w = 0; w < W; w++) {
    const wsd = addDays(start, w * 7), m = new Date(wsd).getMonth();
    if (m !== lastM) { if (w < W - 1) months += `<span style="grid-column:${w + 1}">${cap(new Date(wsd).toLocaleDateString('es-UY', { month: 'short' }).replace('.', ''))}</span>`; lastM = m; }
    for (let d = 0; d < 7; d++) {
      const ts = addDays(wsd, d);
      if (ts > now) { cells += '<i class="fut"></i>'; continue; }
      const c = per[dayKey(ts)] || 0;
      const lvl = c ? Math.min(4, Math.max(1, Math.ceil(c / max * 4))) : 0;
      cells += `<i class="${lvl ? 'l' + lvl : ''} ${dayKey(ts) === dayKey(now) ? 'td' : ''}" style="animation-delay:${(.15 + w * .025).toFixed(3)}s"></i>`;
    }
  }
  const cols = `grid-template-columns:repeat(${W},${W > 20 ? '12px' : '1fr'})`;
  return `<div class="hm"><div class="hm-m" style="${cols}">${months}</div><div class="hm-g" style="${cols}">${cells}</div></div>`;
}

function sessPRs(s) { return s.exercises.reduce((a, e) => a + e.sets.filter(x => x.pr).length, 0); }

}

    else { const b = num(v.r); s.r = Math.max(1, (Number.isFinite(b) ? Math.round(b) : 0) + (+d.d)); if (s.w === '' && v.w !== '') s.w = v.w; }
    bumpF = d.k === 'w' ? 'cw' : 'cr';
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  complete: () => {
    const a = S.active, e = curEx(), j = e.sets.findIndex(s => !s.done); if (j < 0) return;
    const g = sug(e, j, lastFor(e.exerciseId, a.start)), v = curVals(e, j, g), s = e.sets[j];
    const w = num(v.w), r = num(v.r);
    if (!Number.isFinite(w) || w < 0) { toast('Ingresá el peso (0 si es peso corporal)'); return; }
    if (!Number.isFinite(r) || r <= 0) { toast('Ingresá las repeticiones'); return; }
    s.w = w; s.r = Math.round(r); s.done = true; s.ts = Date.now();
    const b = bestBefore(e.exerciseId, a.start);
    const others = e.sets.filter(x => x.done && x !== s);
    const bestE = Math.max(b.e1, 0, ...others.map(x => e1rm(x.w, x.r))), bestW = Math.max(b.w, 0, ...others.map(x => x.w));
    s.pr = b.any && w > 0 && (e1rm(w, s.r) > bestE + 0.01 || w > bestW);
    if (!s.pr) delete s.pr;
    unlockAudio();
    justDone = { id: e.id, k: j };
    if (s.pr) { toast('🏆 ¡Nuevo récord!', true); beep([660, 880, 1320]); confetti(70); }
    if (!e.sets.some(x => !x.done)) { const nx = nextPending(a, a.cur); if (nx >= 0) a.cur = nx; }
    if (a.exercises.some(pending)) { a.restEnd = Date.now() + e.rest * 1000; a.restTotal = e.rest; $('#rest').innerHTML = ''; }
    peek = false; wkRender();
  },
  undoSet: d => { const a = S.active, e = curEx(), s = e.sets[+d.k]; s.done = false; delete s.pr; a.restEnd = 0; peek = false; wkRender(); },
  addSet: () => { const e = curEx(); e.sets.push({ w: '', r: '', done: false }); e.skipped = false; peek = false; wkRender(); },
  jump: d => { const a = S.active; closeModal(); a.cur = +d.i; peek = true; wkRender(); },
  nextEx: () => {
    const a = S.active, nx = nextPending(a, a.cur);
    if (nx < 0) { toast('No hay otro ejercicio pendiente'); return; }
    a.cur = nx; peek = false; wkRender(); toast('El anterior queda para después');
  },
  exHist: () => {
    const e = curEx(), ser = exSeries(e.exerciseId);
    openModal(`<div class="kicker">${esc(e.muscle || '')}</div><div class="t" style="font-size:21px;margin-top:4px">${esc(e.name)}</div>
      ${ser.length ? `<div class="mu sm" style="margin-top:8px">Fuerza estimada (1RM): <b style="color:var(--tx)">${Math.round(ser[ser.length - 1].e1)} ${unit()}</b></div>${lineChart(ser.slice(-12).map(x => ({ x: x.date, y: x.e1 })), unit())}
      <div style="margin-top:8px">${[...ser].reverse().slice(0, 5).map(x => `<div class="drow"><span class="sp">${fmtShort(x.date)}</span><span class="mu sm">${x.sets.map(s => fmtNum(s.w) + '×' + s.r).join(' · ')}</span></div>`).join('')}</div>`
      : `<p class="mu">Es la primera vez que hacés este ejercicio. Después de hoy vas a ver acá tu evolución.</p>`}
      <button class="big" data-a="closeModal">Cerrar</button>`);
  },
  chooseEx: () => {
    const a = S.active;
    openModal(`<div class="row"><div class="t sp" style="font-size:19px">Ir a otro ejercicio</div><button class="ghost" data-a="closeModal">Cerrar</button></div>
      <p class="mu sm">Los que dejes a medias quedan pendientes.</p>
      ${a.exercises.map((e, i) => {
        const dn = e.sets.filter(s => s.done).length;
        const st = e.skipped ? 'Omitido' : dn === e.sets.length ? '<span class="up">✓ Hecho</span>' : dn ? `${dn}/${e.sets.length}` : 'Pendiente';
        return `<button class="pick" data-a="jump" data-i="${i}"><span class="mu" style="width:20px">${i + 1}</span><span class="sp" style="${i === a.cur ? 'font-weight:700' : ''}">${esc(e.name)}</span><span class="mu sm">${st}</span></button>`;
      }).join('')}
      <button class="big" data-a="wkAdd">+ Añadir ejercicio</button>`);
  },
  exMenu: () => {
    const e = curEx(), hasDone = e.sets.some(s => s.done), pend = e.sets.some(s => !s.done);
    openModal(`<div class="t" style="font-size:19px;margin-bottom:6px">${esc(e.name)}</div>
      ${!hasDone ? `<button class="big" data-a="replaceEx">Cambiar por otro ejercicio</button>` : ''}
      <button class="big" data-a="addSetMenu">Agregar una serie</button>
      ${pend && e.sets.length > 1 ? `<button class="big" data-a="delSet">Quitar una serie</button>` : ''}
      ${!e.skipped && pend ? `<button class="big" data-a="skipEx">Omitir por hoy</button>` : ''}
      ${!hasDone ? `<button class="big ghost danger" data-a="wkRemove">Quitar de esta sesión</button>` : ''}
      <button class="big ghost" data-a="closeModal">Cancelar</button>`);
  },
  addSetMenu: () => { closeModal(); A.addSet(); },
  delSet: () => {
    const e = curEx(); closeModal();
    for (let k = e.sets.length - 1; k >= 0; k--) if (!e.sets[k].done) { e.sets.splice(k, 1); break; }
    wkRender();
  },
  skipEx: () => {
    const a = S.active, e = curEx(); closeModal(); e.skipped = true;
    const nx = nextPending(a, a.cur); if (nx >= 0) a.cur = nx;
    peek = false; wkRender(); toast('Omitido por hoy');
  },
  unskip: d => { const a = S.active; a.exercises[+d.i].skipped = false; a.cur = +d.i; peek = false; wkRender(); },
  replaceEx: () => {
    const a = S.active, i = a.cur, e = a.exercises[i]; closeModal();
    openPicker(id => { a.exercises[i] = mkWkEx(id, e.sets.length, e.repMin, e.repMax, e.rest, ''); wkRender(); toast('Ejercicio cambiado'); });
  },
  wkRemove: () => {
    const a = S.active; closeModal(); a.exercises.splice(a.cur, 1);
    a.cur = a.exercises.findIndex(pending); if (a.cur < 0) a.cur = 0;
    wkRender();
  },
  wkAdd: () => openPicker(id => {
    const a = S.active; a.exercises.push(mkWkEx(id, 3, 8, 10, S.settings.rest, '')); a.cur = a.exercises.length - 1; peek = false; wkRender();
  }),
  wkMenu: () => openModal(`<div class="t" style="font-size:19px">Entrenamiento en curso</div><p class="mu">Todo lo que registraste ya está guardado.</p>
    <button class="big" data-a="wkExit">Salir y seguir más tarde</button>
    <button class="big ghost danger" data-a="wkDiscard">Descartar entrenamiento</button>
    <button class="big ghost" data-a="closeModal">Cancelar</button>`),
  wkExit: () => { closeModal(); go('home'); },
  wkDiscard: () => ask('Descartar entrenamiento', 'Se borran todas las series de esta sesión. No se puede deshacer.', 'Descartar', () => { S.active = null; save(); go('home'); }, true),
  finish: () => {
    const a = S.active;
    let dn = 0, pend = 0;
    a.exercises.forEach(e => e.sets.forEach(s => s.done ? dn++ : (!e.skipped && pend++)));
    if (!dn) { ask('Sin series registradas', 'No completaste ninguna serie. ¿Querés descartar este entrenamiento?', 'Descartar', () => { S.active = null; save(); go('home'); }, true); return; }
    ask('Terminar entrenamiento', `${dn} series completadas.${pend ? ` Las ${pend} pendientes no se guardarán.` : ''}`, 'Terminar y guardar', finishSession);
  },
  finishNow: () => finishSession(),
  restAdj: d => { const a = S.active; a.restEnd = Math.max(Date.now() + 1000, a.restEnd + (+d.d) * 1000); a.restTotal = Math.max(1, (a.restTotal || 120) + (+d.d)); save(); renderRest(); },
  restSkip: () => { S.active.restEnd = 0; save(); renderRest(); },

  // historial
  toggleEditHist: () => { editHist = !editHist; render(); },
  hDelSet: d => {
    const s = S.sessions.find(x => x.id === R.id), e = s.exercises[+d.i];
    e.sets.splice(+d.j, 1); if (!e.sets.length) s.exercises.splice(+d.i, 1);
    s.u = Date.now(); save(); render();
  },
  delSession: d => ask('Eliminar entrenamiento', 'Se borra del historial de forma permanente.', 'Eliminar', () => {
    S.sessions = S.sessions.filter(s => s.id !== d.id); S.deleted.push(d.id); save(); fresh = null; logD = null; R.view = 'history'; go('history'); toast('Entrenamiento eliminado');
  }, true),

  // ajustes
  export: () => doExport(),
  import: () => $('#impf').click(),
  wipe: () => ask('Borrar todos los datos', 'Se eliminan rutinas, ejercicios propios y todo el historial de este dispositivo. Exportá un respaldo antes si querés conservarlos.', 'Borrar todo', () => {
    S = importSheet(migrate(seed())); save(); go('home'); toast('Datos borrados');
  }, true),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});

function onField(e) {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  const d = el.dataset, v = el.value;
  if (f === 'cw' || f === 'cr') {
    const ex = curEx(), j = ex.sets.findIndex(s => !s.done); if (j < 0) return;
    const s = ex.sets[j], g = sug(ex, j, lastFor(ex.exerciseId, S.active.start)), cv = curVals(ex, j, g);
    if (f === 'cw') { s.w = v; if (s.r === '') s.r = cv.r; const p = $('#plates'); if (p) p.textContent = plates(num(v), ex.name); }
    else { s.r = v; if (s.w === '' && cv.w !== '') s.w = cv.w; }
    save();
  }
  else if (f === 'dname') draft.name = v;
  else if (f === 'ddesc') draft.desc = v;
  else if (f === 'it') draft.items[+d.i][d.k] = (d.k === 'notes' || d.k === 'startW') ? v : (d.k === 'rest' ? +v : v);
  else if (f === 'pq') { pickQ = v; $('#plist').innerHTML = pickerList(); }
  else if (f === 'hs') { const s = S.sessions.find(x => x.id === R.id); const n = num(v); if (Number.isFinite(n) && n >= 0) { s.exercises[+d.i].sets[+d.j][d.k] = d.k === 'r' ? Math.round(n) : n; s.u = Date.now(); save(); } }
  else if (f === 'exq') { exQ = v; const l = $('#exlist'); if (l) l.innerHTML = exListHtml(); }
  else if (f === 'prof') { S.profile[d.k] = v.trim(); S.profile.u = Date.now(); save(); }
  else if ((f === 'lgd' || f === 'lgt' || f === 'lgm') && logD) {
    const dur = f === 'lgm' ? (Math.max(1, parseInt(v) || 0) * 60000) : (logD.end - logD.start);
    if (f !== 'lgm') {
      const dEl = $('[data-f="lgd"]'), tEl = $('[data-f="lgt"]');
      const [y, m, dd] = (dEl.value || ymd(logD.start)).split('-').map(Number), [hh, mi] = (tEl.value || hhmm(logD.start)).split(':').map(Number);
      const st = new Date(y, m - 1, dd, hh, mi).getTime(); if (Number.isFinite(st)) logD.start = st;
    }
    logD.end = logD.start + dur;
  }
  else if (f === 'lg') { if (logD) logD.exercises[+d.i].sets[+d.j][d.k] = v; }
  else if (f === 'uname') { S.settings.name = v.trim(); S.settings.u = Date.now(); save(); }
  else if (f === 'unit') { S.settings.unit = v; S.settings.u = Date.now(); save(); }
  else if (f === 'step') { S.settings.step = +v; S.settings.u = Date.now(); save(); }
  else if (f === 'bar') { S.settings.bar = +v; S.settings.u = Date.now(); save(); }
  else if (f === 'drest') { S.settings.rest = +v; S.settings.u = Date.now(); save(); }
}
document.addEventListener('input', onField);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT' || e.target.type === 'date' || e.target.type === 'time') onField(e); });
document.addEventListener('focusin', e => { if (e.target.tagName === 'INPUT' && e.target.closest('.stepper')) setTimeout(() => e.target.select(), 0); });

/* ---------- Arranque ---------- */
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
if (AUTH) syncNow();
</script>
